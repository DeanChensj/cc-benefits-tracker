    <title>PerkFolio — The Local-First, No-Plaid Credit Card Tracker</title>
    <meta name="description" content="The ultimate zero-trust local card app. Track your Amex, Chase, and Citi credit card benefits securely without Plaid or account logins." />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />

    <meta property="og:title" content="PerkFolio — The Local-First, No-Plaid Credit Card Tracker" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://perkfolio.cc/" />
    <meta name="twitter:title" content="PerkFolio — The Local-First, No-Plaid Credit Card Tracker" />
    <meta name="twitter:description" content="The ultimate zero-trust local card app. Track your Amex, Chase, and Citi credit card benefits securely without Plaid or account logins." />

    <!-- PWA Manifest & Apple Mobile App Meta Tags -->
    <link rel="manifest" href="./manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <link rel="apple-touch-icon" href="./icon.png" />
    <meta name="theme-color" content="#0b0f19" />

    <!-- Service Worker Registration (Dynamically self-heals paths for dev, subfolders, and production) -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          const base = window.location.pathname.endsWith('/') 
            ? window.location.pathname 
            : window.location.pathname.substring(0, window.location.pathname.lastIndexOf('/') + 1);
          
          navigator.serviceWorker.register(base + 'sw.js')
            .then(reg => console.log('Service Worker registered successfully with scope:', reg.scope))
            .catch(err => console.error('Service Worker registration failed:', err));
        });
      }
    </script>
    
    <!-- Privacy-First Cookieless Analytics (Umami) -->
    <script defer src="https://cloud.umami.is/script.js" data-website-id="e2c4581c-f2e4-4257-876a-d414a3c919f9"></script>
  </head>
  <body class="bg-slate-950">
    <div id="root"></div>

  </body>
