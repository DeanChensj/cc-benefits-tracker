<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💳</text></svg>" />

    <meta name="description" content="A premium, local-first personal credit card benefit tracker. Zero account logins, absolute privacy, automated cross-month rollovers, and native calendar subscriptions." />
    
    <!-- PWA Manifest & Apple Mobile App Meta Tags -->
    <link rel="manifest" href="./manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js')
            .then(reg => console.log('Service Worker registered successfully!'))
            .catch(err => console.error('Service Worker registration failed:', err));
        });
      }
    </script>
    
    <!-- Privacy-First Cookieless Analytics (Umami) -->
    <script defer src="https://cloud.umami.is/script.js" data-website-id="e2c4581c-f2e4-4257-876a-d414a3c919f9"></script>
  </head>
